# Публичный IP и чужие имена не должны попадать в панель.
# default_server обрывает заход по IP и по любому неизвестному домену.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name klo.local;
    # ssl_certificate и ключ подставь свои

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Server;
    }
}
